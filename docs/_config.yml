# Site settings — accessed in layouts as {{ site.title }}, {{ site.email }}, etc.

title: Nat Echlin
description: Working on projects I find interesting, and writing about them.
email: nat.echlin@gmail.com
url: "https://nat-echlin.com"

twitter_username: NatEchlin
github_username: nat-echlin

# No theme gem. Layouts live in _layouts/, styling in assets/css/style.css,
# so everything the site looks like is in this repo and editable.

plugins:
  - jekyll-feed

# Markdown. Left on kramdown's defaults deliberately — that is what turns
# $$...$$ into \(...\) inline and \[...\] display for the MathJax script in
# _layouts/default.html. Changing `input` here would re-flow existing posts.
markdown: kramdown
kramdown:
  auto_ids: true
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
